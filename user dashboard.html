<script>

        darkMode: "class",

</header>
<main class="px-6 pb-24">

<p class="text-slate-500 dark:text-slate-400 mt-1">Your data is safe and secured.</p>

<section class="mt-8">

<button onclick="navigateTo('medical reports.html')" class="flex flex-col items-start p-5 bg-card-light dark:bg-card-dark border border-slate-100 dark:border-slate-800 rounded-3xl shadow-sm hover:shadow-md transition-all active:scale-95 text-left">

</div>

</button>
</div>
</section>
<section class="mt-10">

<div class="space-y-3">

<div class="w-12 h-12 flex items-center justify-center bg-red-100 dark:bg-red-900/30 text-red-600 rounded-xl">

</div>
<div class="flex items-center gap-4 p-4 bg-card-light dark:bg-card-dark border border-slate-100 dark:border-slate-800 rounded-2xl">
<div class="w-12 h-12 flex items-center justify-center bg-amber-100 dark:bg-amber-900/30 text-amber-600 rounded-xl">

</div>
<div class="flex-1">

<p class="text-xs text-slate-400 dark:text-slate-500">3 days ago</p>
</div>
<button class="text-slate-400 dark:text-slate-500">
<span class="material-symbols-rounded">more_vert</span>
</button>
</div>
</div>

<nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-100 dark:border-slate-800 px-6 pb-8 pt-4 flex justify-between items-center z-50">
<button onclick="navigateTo('user dashboard.html')" class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-rounded">grid_view</span>
<span class="text-[10px] font-bold uppercase tracking-tight">Home</span>
</button>
<button onclick="navigateTo('documents.html')" class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500">
<span class="material-symbols-rounded">folder_open</span>
<span class="text-[10px] font-bold uppercase tracking-tight">Files</span>
</button>
<div class="relative -top-8">
<button class="w-14 h-14 bg-primary text-white rounded-full flex items-center justify-center shadow-lg shadow-primary/30 active:scale-90 transition-transform">
<span class="material-symbols-rounded text-3xl">add</span>
</button>
</div>
<button onclick="navigateTo('user dashboard.html')" class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500">
<span class="material-symbols-rounded">lock</span>
<span class="text-[10px] font-bold uppercase tracking-tight">Vault</span>
</button>
<button onclick="handleLogout()" class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500">
<span class="material-symbols-rounded">logout</span>
<span class="text-[10px] font-bold uppercase tracking-tight">Exit</span>
</button>
</nav>
<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[60] hidden transition-opacity flex items-end" id="upload-menu">
<div class="w-full bg-background-light dark:bg-background-dark rounded-t-[2.5rem] p-8 animate-in slide-in-from-bottom duration-300">
<div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-8"></div>
<h3 class="text-xl font-bold mb-6">Quick Secure Upload</h3>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col items-center p-6 bg-card-light dark:bg-card-dark rounded-3xl border border-slate-100 dark:border-slate-800">
<span class="material-symbols-rounded text-primary text-3xl mb-2">upload_file</span>
<span class="text-sm font-semibold">Document</span>
</button>
<button class="flex flex-col items-center p-6 bg-card-light dark:bg-card-dark rounded-3xl border border-slate-100 dark:border-slate-800">
<span class="material-symbols-rounded text-primary text-3xl mb-2">password</span>
<span class="text-sm font-semibold">Credential</span>
</button>
<button class="flex flex-col items-center p-6 bg-card-light dark:bg-card-dark rounded-3xl border border-slate-100 dark:border-slate-800">
<span class="material-symbols-rounded text-primary text-3xl mb-2">medical_information</span>
<span class="text-sm font-semibold">Medical</span>
</button>
<button class="flex flex-col items-center p-6 bg-card-light dark:bg-card-dark rounded-3xl border border-slate-100 dark:border-slate-800">
<span class="material-symbols-rounded text-primary text-3xl mb-2">note_add</span>
<span class="text-sm font-semibold">Secure Note</span>
</button>
</div>
<button class="w-full mt-8 py-4 bg-slate-200 dark:bg-slate-800 rounded-2xl font-bold" onclick="toggleUploadMenu()">Cancel</button>
</div>
</div>
<script>
        function toggleUploadMenu() {
            const menu = document.getElementById('upload-menu');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } else {
                menu.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        }
        // Attach event to the center plus button
        document.querySelector('.fixed.bottom-0 button.w-14').addEventListener('click', toggleUploadMenu);
        // Dark mode toggle simulation (can be added to profile)
        // For now, let's just make sure it stays in sync with system or a switcher if we had one.
    </script>

<script src="app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', initDashboard);
