<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DigiRaksha - Admin Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#0F3D2E",
          secondary: "#1B7F5A",
          "background-light": "#F3FBF8",
          "background-dark": "#0A1210",
        },
        fontFamily: { sans: ["Inter", "sans-serif"] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col">

<header class="h-16 border-b border-emerald-100 dark:border-emerald-900/40 flex items-center justify-between px-8">
  <a href="homepage.html" class="flex items-center gap-2">
    <span class="material-symbols-outlined text-primary dark:text-emerald-400">shield</span>
    <span class="text-xl font-black text-primary dark:text-emerald-400 tracking-tight">DigiRaksha</span>
  </a>
  <a href="login.html" class="text-sm font-semibold text-secondary hover:text-primary transition-colors">Back to Access Portal</a>
</header>

<main class="flex-1 flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md bg-white dark:bg-zinc-900 rounded-2xl p-8 shadow-lg border border-zinc-100 dark:border-zinc-800">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-2xl mx-auto flex items-center justify-center mb-4">
        <span class="material-symbols-outlined text-3xl text-primary">admin_panel_settings</span>
      </div>
      <h1 class="text-2xl font-bold text-primary dark:text-white">Admin Authentication</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Sign in with authorized administrator credentials</p>
    </div>

    <form class="space-y-5" onsubmit="handleAdminLogin(event)">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-primary dark:text-slate-300 mb-2" for="email">Admin Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-slate-400 text-lg">badge</span>
          </span>
          <input class="block w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:border-secondary focus:ring-1 focus:ring-secondary rounded-xl text-primary dark:text-white placeholder-slate-400 transition-all" id="email" name="email" placeholder="Enter admin username" type="text"/>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-primary dark:text-slate-300 mb-2" for="password">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-slate-400 text-lg">lock</span>
          </span>
          <input class="block w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:border-secondary focus:ring-1 focus:ring-secondary rounded-xl text-primary dark:text-white placeholder-slate-400 transition-all" id="password" name="password" placeholder="Enter admin password" type="password"/>
        </div>
      </div>
      <button class="w-full bg-primary hover:bg-secondary text-white font-semibold py-3 rounded-xl shadow-md transition-all" type="submit">
        Sign In as Admin
      </button>
    </form>

    <div class="mt-6 flex items-center justify-center gap-2 text-slate-400">
      <span class="material-symbols-outlined text-sm">verified_user</span>
      <span class="text-xs font-bold uppercase tracking-widest">Restricted Administrative Access</span>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
