<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Profile Settings - DigiRaksha</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#0F3D2E",
                        "background-light": "#F9FAFB",
                        "background-dark": "#111827",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-input {
            @apply w-full px-4 py-3 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-gray-900 dark:text-gray-100;
        }
        .ios-label {
            @apply block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1.5 ml-1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen">
<div class="max-w-full md:max-w-4xl mx-auto min-h-screen flex flex-col shadow-2xl bg-white dark:bg-gray-900 relative">
<div class="h-10 flex items-center justify-between px-6 py-2">
<span class="text-xs font-semibold dark:text-white">9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-icons-round text-sm dark:text-white">signal_cellular_alt</span>
<span class="material-icons-round text-sm dark:text-white">wifi</span>
<span class="material-icons-round text-sm dark:text-white">battery_full</span>
</div>
</div>
<header class="px-4 py-3 flex items-center justify-between border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center gap-3">
<div class="bg-primary p-1.5 rounded-lg">
<span class="material-icons-round text-white text-xl">shield</span>
</div>
<div>
<h1 class="text-sm font-bold text-primary dark:text-green-500 tracking-tight leading-none">DigiRaksha</h1>
<p class="text-[10px] text-gray-400 dark:text-gray-500 font-medium">Personal Digital Vault</p>
</div>
</div>
<button type="button" onclick="navigateTo('user dashboard.html')" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-icons-round text-gray-600 dark:text-gray-300">more_vert</span>
</button>
</header>
<main class="flex-1 flex flex-col overflow-y-auto">
<div class="flex flex-1">
<nav class="w-16 flex flex-col items-center py-6 border-r border-gray-100 dark:border-gray-800 space-y-8 bg-gray-50 dark:bg-gray-900/50">
<button class="flex flex-col items-center gap-1 text-primary dark:text-green-500">
<span class="material-icons-round">person</span>
<span class="text-[9px] font-bold uppercase tracking-wider">Profile</span>
</button>
<button type="button" onclick="deleteCurrentAccount(event)" class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-600 hover:text-red-500 transition-colors">
<span class="material-icons-round">no_accounts</span>
<span class="text-[9px] font-bold uppercase tracking-wider">Delete</span>
</button>
<button onclick="navigateTo('user dashboard.html')" class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-600">
<span class="material-icons-round">lock</span>
<span class="text-[9px] font-bold uppercase tracking-wider">Vault</span>
</button>
<button type="button" onclick="document.getElementById('profile-full-name').focus()" class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-600">
<span class="material-icons-round">settings</span>
<span class="text-[9px] font-bold uppercase tracking-wider">Config</span>
</button>
</nav>
<div class="flex-1 p-6">
<div class="flex flex-col items-center mb-8 relative">
<div class="w-24 h-24 rounded-full bg-gray-200 dark:bg-gray-800 border-4 border-white dark:border-gray-700 overflow-hidden shadow-md flex items-center justify-center">
<img alt="User Profile Image" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZlJaSSFpsgGc-UCTIhHNUpgo7lFhvtp0crmmeo7cvw_WV74NHMetMk-jNmLLZJa4a7uROyvDFKsIaeUqCeizKKQfT9GSxEdegrRSz5S5iBPGmhDIgxSLInYP0IRkdoSAIs6m2ZPlkUSF8TWEQjqDlZgCZfssr8NdRJJSb0CQtgmYH66DlKrNv5h4HklF42hJx7YJs0pPYrX6Kv8W4ZSa498v8BDyT96nxCaRPF77AMYdJ_3VAvSs8FgDQpw1FMKyKA1c-urzMxB6f"/>
</div>
<button class="absolute bottom-0 right-1/2 translate-x-12 translate-y-1 bg-primary text-white p-2 rounded-full shadow-lg border-2 border-white dark:border-gray-900">
<span class="material-icons-round text-sm">photo_camera</span>
</button>
<h2 id="profile-display-name" class="mt-4 font-semibold text-lg text-gray-900 dark:text-white">John Doe</h2>
<p class="text-xs text-gray-500">Last updated: 2 days ago</p>
</div>
<div class="space-y-5">
<div class="flex items-center gap-2 mb-2">
<span class="material-icons-round text-primary text-base">badge</span>
<h3 class="font-bold text-sm uppercase tracking-widest text-gray-400">Personal Information</h3>
</div>
<div>
<label class="ios-label">Full Name</label>
<input id="profile-full-name" class="ios-input" placeholder="Enter full name" type="text" value="Johnathon Doe"/>
</div>
<div>
<label class="ios-label">Email Address</label>
<input id="profile-email" class="ios-input" placeholder="Enter email" type="email" value="john.doe@example.com"/>
</div>
<div>
<label class="ios-label">Phone Number</label>
<input id="profile-phone" class="ios-input" placeholder="Enter phone number" type="tel" value="+1 (555) 000-0000"/>
</div>
<div class="grid grid-cols-1 gap-5">
<div>
<label class="ios-label">Date of Birth</label>
<div class="relative">
<input id="profile-dob" class="ios-input" type="date" value="1990-05-15"/>
<span class="material-icons-round absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xl">calendar_today</span>
</div>
</div>
</div>
<div>
<label class="ios-label">Address</label>
<textarea id="profile-address" class="ios-input h-24 resize-none" placeholder="Enter your full address">123 Digital Vault Street, Secure City, SC 94000</textarea>
</div>
</div>
<div class="mt-10 pt-6 border-t border-gray-100 dark:border-gray-800">
<button type="button" onclick="deleteCurrentAccount(event)" class="w-full flex items-center justify-between p-4 rounded-xl border-2 border-red-50 dark:border-red-900/20 bg-red-50/50 dark:bg-red-900/10 group">
<div class="flex items-center gap-3">
<span class="material-icons-round text-red-500">delete_forever</span>
<div class="text-left">
<p class="text-sm font-semibold text-red-600 dark:text-red-400">Delete Account</p>
<p class="text-[10px] text-red-400">Permanently erase all vault data</p>
</div>
</div>
<span class="material-icons-round text-red-300 group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
</div>
</div>
</main>
<footer class="p-6 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 flex gap-3">
<button onclick="navigateTo('user dashboard.html')" class="flex-1 py-3.5 border-2 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 font-semibold rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                Cancel
            </button>
<button onclick="saveUserProfile(event)" class="flex-[2] py-3.5 bg-primary text-white font-semibold rounded-xl hover:opacity-90 transition-opacity flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
<span class="material-icons-round text-lg">save</span>
                Save Changes
            </button>
</footer>
<div class="flex justify-center pb-2">
<div class="w-32 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full"></div>
</div>
</div>

<script src="app.js"></script>
<script>document.addEventListener('DOMContentLoaded', initUserProfilePage);</script>
</body></html>
