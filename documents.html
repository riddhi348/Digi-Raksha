<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document Upload and Encryption - DigiRaksha</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0f3e2e",
                        "accent-green": "#1B7F5A",
                        "neon-mint": "#3DDC97",
                        "background-light": "#F3FBF8",
                        "background-dark": "#131f1b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#121715] dark:text-white min-h-screen">
<div class="relative mx-auto max-w-full md:max-w-4xl min-h-screen flex flex-col shadow-2xl bg-white dark:bg-background-dark overflow-hidden">
<!-- TopAppBar -->
<header class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between border-b border-gray-100 dark:border-gray-800">
<div onclick="navigateTo('user dashboard.html')" class="text-primary dark:text-neon-mint flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-3xl">chevron_left</span>
</div>
<h2 class="text-primary dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Upload Document</h2>
</header>
<main class="flex-1 overflow-y-auto px-4 py-6 space-y-6">
<!-- EmptyState / Upload Area -->
<div class="flex flex-col">
<div class="flex flex-col items-center gap-6 rounded-xl border-2 border-dashed border-accent-green bg-accent-green/5 px-6 py-12 transition-all hover:bg-accent-green/10 cursor-pointer">
<div class="flex size-16 items-center justify-center rounded-full bg-accent-green/20 text-accent-green">
<span class="material-symbols-outlined text-4xl">cloud_upload</span>
</div>
<div class="flex max-w-[480px] flex-col items-center gap-2">
<p class="text-primary dark:text-white text-lg font-bold leading-tight text-center">Drag and Drop</p>
<p class="text-gray-600 dark:text-gray-400 text-sm font-normal leading-normal text-center">Tap to select or drag files here (Max 20MB)</p>
</div>
<input type="file" id="fileInput" class="hidden">
<button onclick="document.getElementById('fileInput').click()" class="flex min-w-[120px] cursor-pointer items-center justify-center rounded-lg h-11 px-6 bg-primary text-white text-sm font-bold leading-normal transition-transform active:scale-95">
<span class="truncate">Select File</span>
</button>
</div>
</div>
<!-- ListItem: Selected File -->
<div class="space-y-2">
<h3 class="text-primary dark:text-white text-sm font-bold uppercase tracking-wider px-1">Selected File</h3>
<div class="flex items-center gap-4 bg-gray-50 dark:bg-gray-800/50 rounded-xl px-4 min-h-[72px] py-2 justify-between border border-gray-100 dark:border-gray-700">
<div class="flex items-center gap-4">
<div class="text-primary dark:text-neon-mint flex items-center justify-center rounded-lg bg-white dark:bg-gray-700 shadow-sm shrink-0 size-12">
<span class="material-symbols-outlined">description</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-primary dark:text-white text-base font-semibold leading-normal line-clamp-1">policy_doc.pdf</p>
<p class="text-gray-500 dark:text-gray-400 text-sm font-normal leading-normal">1.2 MB</p>
</div>
</div>
<div class="shrink-0">
<div class="text-red-500 flex size-8 items-center justify-center cursor-pointer hover:bg-red-50 dark:hover:bg-red-900/20 rounded-full transition-colors">
<span class="material-symbols-outlined">cancel</span>
</div>
</div>
</div>
</div>
<!-- Encryption Progress Section -->
<div class="rounded-xl border border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 overflow-hidden shadow-sm">
<div class="bg-gray-50 dark:bg-gray-800/50 px-4 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center gap-2">
<span class="material-symbols-outlined text-accent-green text-xl">verified_user</span>
<h3 class="text-primary dark:text-white text-base font-bold leading-tight">Encryption in Progress</h3>
</div>
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-end">
<p class="text-primary dark:text-gray-300 text-sm font-medium leading-normal">Encrypting with AES-256...</p>
<p class="text-accent-green dark:text-neon-mint text-lg font-bold leading-normal">65%</p>
</div>
<!-- ProgressBar -->
<div class="h-2.5 w-full rounded-full bg-gray-200 dark:bg-gray-700">
<div class="h-full rounded-full bg-neon-mint shadow-[0_0_10px_rgba(61,220,151,0.5)] transition-all duration-500" style="width: 65%;"></div>
</div>
<div class="flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-gray-400 text-sm">lock</span>
<p class="text-gray-500 dark:text-gray-400 text-xs font-normal leading-normal">Securing your document in DigiRaksha vault</p>
</div>
</div>
</div>
</main>
<!-- Fixed Footer Action -->
<footer class="p-6 bg-white dark:bg-background-dark border-t border-gray-100 dark:border-gray-800">
<button onclick="handleDocumentUpload(event)" class="w-full flex cursor-pointer items-center justify-center rounded-xl h-14 px-4 bg-primary text-white text-lg font-bold leading-normal tracking-wide shadow-lg active:scale-[0.98] transition-all">
<span class="truncate">Confirm Upload</span>
<span class="material-symbols-outlined ml-2">check_circle</span>
</button>
<!-- iOS Home Indicator Spacing -->
<div class="h-4"></div>
</footer>
<script src="app.js"></script>
</body></html>
