<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            background-color: #f9faf7;

                radial-gradient(at 100% 100%, hsla(158, 64%, 88%, 0.5) 0px, transparent 50%);

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar Component (Immutable Content & Mandatory Styling) -->
<header class="bg-slate-50 dark:bg-slate-950 flex justify-between items-center px-6 h-16 w-full docked full-width top-0 border-b border-emerald-100 dark:border-emerald-900/40 shadow-sm shadow-emerald-900/5 fixed z-50">
<div class="flex items-center gap-stack-sm active:opacity-80 transition-all cursor-pointer">
<span class="material-symbols-outlined text-emerald-900 dark:text-emerald-400" data-icon="shield">shield</span>
<span class="text-xl font-black text-emerald-900 dark:text-emerald-500 tracking-widest font-public-sans">FORTRESS</span>
</div>
<div class="flex items-center gap-stack-md">
<span class="hidden md:block font-label-md text-label-md text-slate-500 dark:text-slate-400 font-public-sans font-bold tracking-tight">STATION ALPHA-7</span>
<div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center overflow-hidden border border-emerald-200">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Digital representation of a secure user profile silhouette with glowing circuit lines and professional aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8MPGN8JXGcMA0pM_1IG4nJ7n24qdMjd-Q5SVcel0H4jCz25W5vDh40nsonGhhseTrTT9i2dwU2R6M0DidiiVGiM9na2CxQh4Z6phK59v6HVA_dmKYPbfnAObP_5m23YV-p9mT5LL7wqlaQZZcjTeBkP0Hhrrzf-OQWaJIxVhyxsTpprHoDVFaiIEQkp7_J7WD4-u9J_w87vPauoCN_dOQ0zJ-wOloxRxcig5VD0jy-f6YTRLaYKSlcxRbjwMTG-6rqEVAXYPiEZGc"/>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center pt-16 px-gutter bg-mesh relative">
<!-- Structural Backdrop Elements -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-50/30 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary-container/10 rounded-full blur-[120px]"></div>
</div>
<div class="w-full max-w-[440px] z-10">
<!-- Institutional Header -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container text-on-primary mb-stack-md shadow-lg shadow-emerald-900/20">
<span class="material-symbols-outlined text-[32px]" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-h1 text-h1 text-primary mb-stack-xs">Protocol Access</h1>
<p class="font-body-md text-body-md text-outline">Enter the encrypted containment zone</p>
</div>
<!-- Login Selection Cards -->
<div class="grid gap-gutter">
<!-- User Login Entry -->
<button onclick="navigateTo('signin.html')" class="group relative flex items-center p-stack-md bg-white border border-emerald-100 rounded-xl transition-all duration-300 hover:border-secondary hover:shadow-xl hover:shadow-emerald-900/5 text-left w-full overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary transform scale-y-0 group-hover:scale-y-100 transition-transform origin-top"></div>
<div class="flex-shrink-0 w-12 h-12 rounded-lg bg-emerald-50 flex items-center justify-center text-secondary group-hover:bg-secondary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<div class="ml-stack-md flex-grow">
<span class="font-h3 text-h3 text-primary block">User Login</span>
<span class="font-caption text-caption text-outline">Standard encrypted vault access</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-secondary group-hover:translate-x-1 transition-all" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Admin Login Entry -->
<button onclick="navigateTo('admin dashboard.html')" class="group relative flex items-center p-stack-md bg-white border border-emerald-100 rounded-xl transition-all duration-300 hover:border-secondary hover:shadow-xl hover:shadow-emerald-900/5 text-left w-full overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary transform scale-y-0 group-hover:scale-y-100 transition-transform origin-top"></div>
<div class="flex-shrink-0 w-12 h-12 rounded-lg bg-slate-50 flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
<div class="ml-stack-md flex-grow">
<span class="font-h3 text-h3 text-primary block">Admin Login</span>
<span class="font-caption text-caption text-outline">System override and oversight access</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-secondary group-hover:translate-x-1 transition-all" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Footer Meta -->
<div class="mt-stack-lg border-t border-emerald-50 pt-stack-md">
<div class="flex flex-col items-center gap-stack-sm">
<div class="flex items-center gap-stack-xs text-caption font-caption text-outline uppercase tracking-widest">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
                        Security Level: Tier 4
                    </div>
<p class="text-caption font-caption text-outline-variant text-center max-w-[280px]">
                        Unauthorized access attempts are logged and reported to central command.
                    </p>
</div>
</div>
</div>
<!-- Decorative Security Visualization -->
<div class="hidden lg:block absolute right-gutter top-1/2 -translate-y-1/2 w-64 h-96 opacity-20">
<div class="w-full h-full border-l border-b border-emerald-200 relative">
<div class="absolute bottom-4 left-4 flex flex-col gap-2">
<div class="h-1 w-32 bg-emerald-200"></div>
<div class="h-1 w-24 bg-emerald-200"></div>
<div class="h-1 w-40 bg-emerald-200"></div>
</div>
<div class="absolute top-0 right-0 p-2 font-caption text-[10px] text-emerald-800 tracking-tighter">
                    V-ENCRYPTION_ACTIVE<br/>
                    UID: FF-009-SEC
                </div>
</div>
</div>
</main>
<!-- Success Message Snackbar (Hidden by default, shown conceptually for style) -->
<div class="fixed bottom-margin right-margin bg-primary-container text-on-primary px-stack-md py-stack-sm rounded-lg shadow-2xl flex items-center gap-stack-sm border border-emerald-700/50 transform translate-y-24 transition-transform hover:translate-y-0 cursor-default">
<span class="material-symbols-outlined text-secondary-fixed" data-icon="verified_user">verified_user</span>
<span class="font-label-md text-label-md">ENCRYPTION ENGINE READY</span>
</div>
<!-- No BottomNavBar or Drawer as per Linear/Transactional Suppression Rules -->
<script src="app.js"></script>
